<body data-page="contact">
<div data-include="header"></div>
<noscript><nav class="noscript-nav" aria-label="Menu principal"><a href="index.html">Accueil</a><a href="qui-sommes-nous.html">Qui sommes-nous</a><a href="pole-sante.html">Nos actions</a><a href="actualites.html">Actualités</a><a href="formations-rapports.html">Formations &amp; rapports</a><a href="s-engager.html">S'engager</a><a href="contact.html">Contact</a><a href="don.html">Faire un don</a></nav></noscript>

<main id="contenu">
  <header class="page-head">
    <div class="wrap">
      <nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a><span>/</span>Contact</nav>
      <span class="kicker">Contact</span>
      <h1>Parlons-en, simplement</h1>
      <p class="lead">Une question, une proposition, un besoin à nous signaler ? Le plus rapide reste WhatsApp.</p>
    </div>
  </header>

  <section class="section">
    <div class="wrap contact-grid">
      <div>
        <ul class="contact-list">
          <li><span class="ic" data-icon="pin"></span><div><small>Siège</small><span class="tbr" data-cfg="adresse"></span><br><span data-cfg="ville"></span></div></li>
          <li><span class="ic" data-icon="whatsapp"></span><div><small>WhatsApp</small><a data-href="whatsapp" data-wa-msg="Bonjour RADES, " href="#" target="_blank" rel="noopener">Écrire sur WhatsApp</a></div></li>
          <li><span class="ic" data-icon="phone"></span><div><small>Téléphone</small><a class="tbr" data-href="telephone" data-cfg="telephone" href="#"></a></div></li>
          <li><span class="ic" data-icon="mail"></span><div><small>E-mail</small><a class="tbr" data-href="email" data-cfg="email" href="#"></a></div></li>
        </ul>
        <a class="btn wa-btn" data-href="whatsapp" data-wa-msg="Bonjour RADES, " href="#" target="_blank" rel="noopener"><span data-icon="whatsapp"></span>Ouvrir WhatsApp</a>
        <div class="mt-32">
          <span class="kicker">Suivez-nous</span>
          <div class="hero__actions mt-0">
            <a class="btn btn--sm" data-href="facebook" href="#" target="_blank" rel="noopener"><span data-icon="facebook"></span>Facebook</a>
            <a class="btn btn--sm" data-href="linkedin" href="#" target="_blank" rel="noopener"><span data-icon="linkedin"></span>LinkedIn</a>
            <a class="btn btn--sm" data-href="instagram" href="#" target="_blank" rel="noopener"><span data-icon="instagram"></span>Instagram</a>
          </div>
        </div>
      </div>

      <form class="form" data-form="contact" data-title="Message depuis le site RADES">
        <div class="field"><label for="c-nom">Nom et prénom</label><input id="c-nom" name="nom" required autocomplete="name"></div>
        <div class="field"><label for="c-tel">Téléphone <span class="opt">(facultatif)</span></label><input id="c-tel" name="telephone" type="tel" autocomplete="tel"></div>
        <div class="field full"><label for="c-mail">E-mail</label><input id="c-mail" name="email" type="email" required autocomplete="email"></div>
        <div class="field full"><label for="c-objet">Objet</label>
          <select id="c-objet" name="objet"><option>Question générale</option><option>Don / reçu</option><option>Partenariat</option><option>Demande de formation</option><option>Signaler une situation</option><option>Presse</option></select></div>
        <div class="field full"><label for="c-msg">Message</label><textarea id="c-msg" name="message" required></textarea></div>
        <label class="consent full"><input type="checkbox" required>J'accepte que RADES utilise ces informations pour me répondre (voir la <a href="confidentialite.html">politique de confidentialité</a>).</label>
        <div class="form-actions full"><button class="btn btn--ink" type="submit">Envoyer le message</button><span class="form-status" aria-live="polite"></span></div>
      </form>
    </div>
  </section>

  <section aria-label="Carte">
    <iframe class="map" data-map title="Carte du siège de RADES à Cotonou" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>
</main>

<div data-include="footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
